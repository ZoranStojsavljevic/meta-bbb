#
# BeagleBone Black - AM335x hardware support
# Linux kernel 7.3.1
#
# --------------------------------------------------
# GPIO and pin multiplexing
# --------------------------------------------------

CONFIG_GPIOLIB=y
CONFIG_GPIO_OMAP=y
CONFIG_PINCTRL=y
CONFIG_PINCTRL_SINGLE=y

# --------------------------------------------------
# Ethernet - AM335x CPSW
# --------------------------------------------------

CONFIG_NET=y
CONFIG_NETDEVICES=y
CONFIG_ETHERNET=y
CONFIG_TI_CPSW=y

# --------------------------------------------------
# USB 2.0
# --------------------------------------------------

CONFIG_USB=y
CONFIG_USB_SUPPORT=y
CONFIG_USB_MUSB_HDRC=m
CONFIG_USB_MUSB_DSPS=m
CONFIG_USB_STORAGE=m
CONFIG_USB_ACM=m

# --------------------------------------------------
# UART - OMAP serial driver
# --------------------------------------------------

CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_OMAP=y
CONFIG_SERIAL_OF_PLATFORM=y

# --------------------------------------------------
# I2C
# --------------------------------------------------

CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_OMAP=y

# --------------------------------------------------
# SPI - McSPI
# --------------------------------------------------

CONFIG_SPI=y
CONFIG_SPI_OMAP24XX=y
CONFIG_SPI_SPIDEV=m

# --------------------------------------------------
# PWM - eCAP and eHRPWM
# --------------------------------------------------

CONFIG_PWM=y
CONFIG_PWM_TIECAP=m
CONFIG_PWM_TIEHRPWM=m

# --------------------------------------------------
# CAN - DCAN
# --------------------------------------------------

CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_DEV=m
CONFIG_CAN_CALC_BITTIMING=y
CONFIG_CAN_C_CAN=m
CONFIG_CAN_C_CAN_PLATFORM=m

# --------------------------------------------------
# ADC - AM335x TSCADC
# --------------------------------------------------

CONFIG_IIO=y
CONFIG_MFD_TI_AM335X_TSCADC=m
CONFIG_TI_AM335X_ADC=m

# --------------------------------------------------
# MMC / SD card
# --------------------------------------------------

CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_OMAP_HS=y

# --------------------------------------------------
# Filesystems
# --------------------------------------------------

CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_FAT_FS=y

# --------------------------------------------------
# Device management
# --------------------------------------------------

CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
